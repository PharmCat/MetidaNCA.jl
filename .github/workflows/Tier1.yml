name: Tier 1
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE.md'
      - 'README.md'
      - '.github/**'
      - '.github/workflows/Documenter.yml'
      - 'docs/**'
      - 'img/**'
      - 'validation/**'
      - 'test/validation**'
      - 'change.log'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'LICENSE.md'
      - 'README.md'
      - '.github/workflows/Documenter.yml'
      - 'docs/**'
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.julia-arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['1.8', '1.10', '1']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest]
        exclude:
          # Test-only dependency chain Plots -> GR -> Qt6Base_jll: the Qt6 DLLs
          # fail to link against the runtime shipped with old Julia on Windows
          # (upstream Yggdrasil issue, not a package problem).
          # Julia 1.8 passes the full suite on Linux, so only this pair is dropped.
          - os: windows-latest
            julia-version: '1.8'
        include:
          - os: macOS-latest
            julia-arch: 'aarch64'
            julia-version: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1' && matrix.julia-arch == 'x64' }}
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
